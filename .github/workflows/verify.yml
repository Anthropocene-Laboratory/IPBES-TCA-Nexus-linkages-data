name: Verify public dataset and analyses
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify.py
      - run: python scripts/11_figure_patterns.py
      - run: python scripts/12_versatility.py
      - run: python -m unittest discover -s tests
